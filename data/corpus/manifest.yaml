# PREFLIGHT synthetic golden corpus
#
# Thirty clips in fifteen VIOLATION/CLEAN pairs. Every clip is generated from
# this file by data/corpus/generate.py using ffmpeg and the platform's built-in
# text-to-speech. No third-party media, no downloads, nothing sourced.
#
# Why synthetic:
#
#   Ground truth is exact BY CONSTRUCTION. The profanity was inserted at
#   4,200ms, so it IS at 4,200ms — no human eyeballed a timestamp. That makes
#   span IoU an honest metric rather than an approximate one.
#
#   The pairs are the point. Each VIOLATION has a CLEAN twin whose surface
#   content is near-identical and whose only difference is context: the same
#   word inside an attributed quotation, the same dangerous act with an explicit
#   warning, the same sponsor read with a disclosure present. A keyword filter
#   scores 50% on this corpus by construction. Only a system that reads context
#   can beat that, which is exactly the claim the triad makes.
#
# Clips are gitignored and regenerate with `make corpus`. This file is 12KB.

version: 1
seed: 20260805

defaults:
  duration_s: 20
  resolution: 1280x720
  fps: 30

clips:
  # ─────────────────────────────────────────────────────────────────────
  # AF-01 language — the canonical hard-negative pair
  # ─────────────────────────────────────────────────────────────────────
  - id: g001
    label: VIOLATION
    clause: AF-01
    script: >
      This next part is going to be rough. Honestly [PROFANITY_STRONG] that
