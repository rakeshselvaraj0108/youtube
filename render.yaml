# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Two services, matched to how the app actually splits: the engine is a
# stdlib HTTP server with a real filesystem and ffmpeg dependency (Docker),
# the deck is a static Vite build that only ever talks to the engine over
# HTTP (a static site, cheaper and instantly cache-served).
#
# The engine runs fully degraded-but-correct with zero secrets set — NVIDIA_API_KEY
# only upgrades individual capability tiers, per .env.example. Fill it in on
# the dashboard (Environment tab) after the first deploy; nothing here can
# see or set its value, by design (`sync: false`).
services:
  - type: web
    name: preflight-api
    runtime: docker
    # Free by default — a hackathon submission has no business defaulting to
    # a paid plan. Free web services on Render spin down after 15 minutes
    # idle and cold-start on the next request; bump this to "starter" in the
    # dashboard once real usage needs it to stay warm.
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Deliberately omitted: the Dockerfile's own CMD already serves on
    # 0.0.0.0:10000 by default. An earlier dockerCommand override here
    # produced a container that never wrote a single byte to stdout and was
    # killed ~20s in — most consistent with dockerCommand not composing with
    # a custom ENTRYPOINT the way plain Docker CMD-override semantics would.
    # Letting Render fall back to "the Dockerfile's own CMD" sidesteps the
    # question entirely instead of relying on unconfirmed behavior.
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: ACOUSTID_API_KEY
        sync: false
      - key: PREFLIGHT_RPM
        value: "30"
      - key: PREFLIGHT_OFFLINE
        value: "0"
      - key: PREFLIGHT_CACHE_DIR
        value: .preflight/cache

  - type: web
    name: preflight-deck
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Not the name-derived guess (https://preflight-api.onrender.com) —
      # Render appended a disambiguation suffix on creation, confirmed from
      # the actual service record rather than assumed.
      - key: VITE_PREFLIGHT_API
        value: https://preflight-api-vax3.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
