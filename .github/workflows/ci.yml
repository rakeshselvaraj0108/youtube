name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui:
    name: UI · contract · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # The schema is generated from src/types/analysis.ts and is the contract
      # the Python engine validates against. If regenerating it produces a diff,
      # the committed schema is stale and the two sides have drifted.
      - name: Contract is current
        run: |
          npm run schema
          git diff --exit-code schema/analysis-report.schema.json

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  engine:
    name: Engine · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: pip install -e '.[dev]'

      - name: Build the policy corpus
        run: python scripts/build_corpus.py

      - name: Tests
        run: pytest -q

      # The page renders the TypeScript scorer and report.json carries the
      # Python one. Regenerating the shared vectors must not move them.
      - name: Scoring contract is stable
        run: |
          python scripts/emit_scoring_vectors.py
          git diff --exit-code tests/fixtures/scoring_vectors.json
