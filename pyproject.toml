[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preflight"
version = "0.1.0"
description = "Static analysis and CI for video — predicts monetization risk before upload and compiles an ffmpeg program that fixes it"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rakesh Selvaraj" }]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "blake3>=0.4",
    "jsonschema>=4.22",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Everything below is optional. `preflight check` must produce a full report
# with none of it installed and no API key — degraded coverage, reported.
asr = ["faster-whisper>=1.0"]
audio = ["librosa>=0.10", "soundfile>=0.12"]
retrieval = ["sentence-transformers>=3.0", "faiss-cpu>=1.8", "rank-bm25>=0.2"]
ocr = ["pytesseract>=0.3", "Pillow>=10.3"]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[project.scripts]
preflight = "preflight.cli:app"

[tool.setuptools.packages.find]
include = ["preflight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
